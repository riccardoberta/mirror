<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- macOS Big Sur squircle: 824×824 content box, 100px transparent margin -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8DFF"/>
      <stop offset="0.55" stop-color="#0A5FD6"/>
      <stop offset="1" stop-color="#053B8F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="folderBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <linearGradient id="folderTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#C9DBFA"/>
    </linearGradient>
    <!-- reflection fades out towards the bottom -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.92" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectMask">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#fade)"/>
    </mask>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021C4A" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#021C4A" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircleClip">
      <rect id="sq" x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <!-- the folder glyph, drawn once and reused for the reflection -->
    <g id="folder">
      <!-- back/tab -->
      <path d="M 300 318 h 150 c 18 0 34 8 44 22 l 22 30 c 10 14 26 22 44 22 h 160 c 22 0 40 18 40 40 v 40 H 260 v -114 c 0 -22 18 -40 40 -40 Z" fill="url(#folderTab)"/>
      <!-- front -->
      <rect x="260" y="420" width="504" height="236" rx="34" fill="url(#folderBody)"/>
      <!-- subtle lip -->
      <rect x="294" y="424" width="436" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </defs>

  <!-- icon body -->
  <g filter="url(#shadow)">
    <use href="#sq" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircleClip)">
    <!-- glossy highlight -->
    <ellipse cx="512" cy="230" rx="520" ry="300" fill="url(#gloss)"/>

    <!-- original folder (upper half) -->
    <g filter="url(#softShadow)">
      <use href="#folder" transform="translate(0,-40)"/>
    </g>

    <!-- mirror surface -->
    <rect x="190" y="650" width="644" height="8" rx="4" fill="url(#line)"/>

    <!-- reflected folder (lower half), flipped around the mirror line, fading out -->
    <g mask="url(#reflectMask)" opacity="0.9">
      <use href="#folder" transform="translate(0,1308) scale(1,-1)"/>
    </g>
  </g>
</svg>
